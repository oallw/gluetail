# Control-server access for gluetail. The control server is only reachable on the
# private "gluetail" Docker network (no host ports are published), so "none" is
# acceptable here; switch to "apikey" if you expose it elsewhere.
# Do NOT allow "GET /v1/vpn/settings": its response includes the WireGuard private key.
[[roles]]
name = "gluetail"
routes = [
  "GET /v1/vpn/status",
  "PUT /v1/vpn/status",
  "PUT /v1/vpn/settings",
  "GET /v1/publicip/ip",
]
auth = "none"
