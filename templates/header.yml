# GENERATED by `./gluetail render` from nodes/*.env and templates/. Do not edit;
# change the node files (or templates/) and render again.
#
# Each exit node is a Tailscale container. A VPN node shares a gluetun
# container's network namespace; a "direct" node exits through this machine's
# own connection. Enable nodes with COMPOSE_PROFILES in .env.

networks:
  gluetail:
    name: gluetail

x-tailscale-exit: &tailscale-exit
  image: tailscale/tailscale:${TAILSCALE_TAG:-v1.102.5}
  restart: unless-stopped
  env_file:
    - ${GLUETAIL_TS_ENV:-./secrets/tailscale.env}
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun

x-gluetun: &gluetun
  # Pinned by digest to the build this project was developed and tested with (a gluetun main-branch
  # build, commit 628b0a2, 2026-04-22). Bump deliberately and re-test country switching.
  image: ${GLUETUN_IMAGE:-qmcgaw/gluetun@sha256:725d3e51091dde4ca43e3e3f26e2e6d3d0ccc66821e92d505c3da04958f7d472}
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  sysctls:
    - net.ipv4.ip_forward=1
    - net.ipv6.conf.all.forwarding=1
  networks:
    - gluetail

services:
