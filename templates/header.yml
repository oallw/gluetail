# GENERATED by `./gluetail render` from nodes/*.env and templates/. Do not edit;
# change the node files (or templates/) and render again.
#
# Each exit node is a Tailscale container. A VPN node shares a gluetun
# container's network namespace; a "direct" node exits through this machine's
# own connection. Enable nodes with COMPOSE_PROFILES in .env.

networks:
  gluetail:
    name: gluetail

x-tailscale-exit: &tailscale-exit
  image: tailscale/tailscale:${TAILSCALE_TAG:-stable}
  restart: unless-stopped
  env_file:
    - ${GLUETAIL_TS_ENV:-./secrets/tailscale.env}
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun

x-gluetun: &gluetun
  image: qmcgaw/gluetun:${GLUETUN_TAG:-latest}
  restart: unless-stopped
  cap_add:
    - NET_ADMIN
  devices:
    - /dev/net/tun:/dev/net/tun
  sysctls:
    - net.ipv4.ip_forward=1
    - net.ipv6.conf.all.forwarding=1
  networks:
    - gluetail

services:
